name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Python 3.9 has a setup-python build for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall projects
      - run: python -m unittest discover -s tests -v
